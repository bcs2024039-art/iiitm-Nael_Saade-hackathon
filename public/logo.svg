<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary seismic shockwave gradient (electric orange to fiery red) -->
    <linearGradient id="fsGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA100" />
      <stop offset="40%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#E61E00" />
    </linearGradient>

    <!-- Secondary pulse gradient (bright amber-gold to deep orange) -->
    <linearGradient id="fsGradSecondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="60%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>

    <!-- Accent highlight gradient -->
    <linearGradient id="fsGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>

    <!-- Subtle container border gradient -->
    <linearGradient id="fsBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#FF6D00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Modern Obsidian Badge Background -->
  <rect width="100" height="100" rx="22" fill="#090E17" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.25" fill="none" stroke="url(#fsBorderGrad)" stroke-width="1.5" />

  <!-- Seismic Monogram Symbol "F" -->
  <g id="foreshockGlyph">
    <!-- Slanted Primary Backbone Stem -->
    <path
      d="M26 18 L39 18 L29 82 L16 82 Z"
      fill="url(#fsGradPrimary)"
    />

    <!-- Top Forward-Thrusting Shockwave Wing -->
    <path
      d="M38 18 L85 18 L73 35 L35 35 Z"
      fill="url(#fsGradPrimary)"
    />

    <!-- Dynamic Seismic Fracture Wedge (Top Accent) -->
    <polygon
      points="86,18 90,24 77,35 73,35"
      fill="url(#fsGradAccent)"
    />

    <!-- Middle Pulse Shockwave Wing -->
    <path
      d="M33 46 L71 46 L60 61 L30 61 Z"
      fill="url(#fsGradSecondary)"
    />

    <!-- Mid Wavefront Wedge (Middle Accent) -->
    <polygon
      points="72,46 76,51 64,61 60,61"
      fill="url(#fsGradAccent)"
    />

    <!-- Seismic Epicenter Pulse Point -->
    <circle cx="21.5" cy="77.5" r="3" fill="#FFC107" />
    <circle cx="21.5" cy="77.5" r="5.5" stroke="#FFA100" stroke-width="1" stroke-opacity="0.5" fill="none" />
  </g>
</svg>
